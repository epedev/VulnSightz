# Copy to .github/workflows/ci.yml (requires a token with the workflow scope).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Documentation phrase lint
        run: python scripts/check_docs_phrases.py
      - name: Unit tests
        run: python -m pytest
      - name: Lab end-to-end (optional)
        if: ${{ false }}
        env:
          VULNSIGHT_LAB_URL: http://127.0.0.1:5001
        run: |
          python -m pip install -r vulnerable-target-app/requirements.txt
          (cd vulnerable-target-app && python init_db.py && python app.py &) 
          sleep 2
          python -m pytest tests/integration -q
